<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPGS Portal — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1a2744;--lime:#7dc534;--g50:#f8fafc;--g200:#e2e8f0;--g300:#cbd5e1;--g400:#94a3b8;--g500:#64748b;--g600:#475569;--g800:#1e293b;--red:#ef4444;--font:'DM Sans',sans-serif}
body{font-family:var(--font);background:var(--g50);color:var(--g800);min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--navy);height:56px;display:flex;align-items:center;padding:0 32px;gap:12px}
.logo-box{width:32px;height:32px;background:var(--lime);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--navy);font-size:14px}
.logo-name{color:#fff;font-weight:700;font-size:15px}
.logo-sep{color:rgba(255,255,255,.3);margin:0 4px}
.logo-sub{color:rgba(255,255,255,.6);font-size:13px}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card{background:#fff;border:1.5px solid var(--g200);border-radius:14px;padding:40px;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(26,39,68,.07)}
.card-title{font-size:22px;font-weight:700;color:var(--navy);margin-bottom:6px}
.card-sub{font-size:14px;color:var(--g500);margin-bottom:28px}
.field{margin-bottom:18px}
label{display:block;font-size:12px;font-weight:600;color:var(--g600);margin-bottom:5px;letter-spacing:.3px;text-transform:uppercase}
.input-wrap{position:relative}
input{width:100%;padding:11px 14px;border:1.5px solid var(--g300);border-radius:8px;font-size:14px;font-family:var(--font);color:var(--g800);background:#fff;outline:none;transition:border-color .15s}
input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(26,39,68,.07)}
input.err{border-color:var(--red)}
.eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--g400);padding:4px;display:flex;align-items:center}
.eye-btn:hover{color:var(--g600)}
.err-msg{font-size:12px;color:var(--red);margin-top:4px;display:none}
.err-msg.show{display:block}
.btn{width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;margin-top:8px;transition:background .15s}
.btn:hover{background:#253360}
.btn:disabled{opacity:.6;cursor:not-allowed}
.alert{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:18px;display:none}
.alert.show{display:block}
.alert.err{background:#fef2f2;border:1px solid #fecaca;color:#dc2626}
.alert.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#16a34a}
footer{text-align:center;padding:20px;font-size:12px;color:var(--g400)}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo-box">P</div>
  <span class="logo-name">Paylode</span>
  <span class="logo-sep">|</span>
  <span class="logo-sub">MPGS Onboarding Portal</span>
</div>
<div class="wrap">
  <div class="card">
    <h1 class="card-title">Set new password</h1>
    <p class="card-sub">Choose a strong password with at least 8 characters.</p>

    <div class="alert err" id="alertErr"></div>
    <div class="alert ok" id="alertOk"></div>

    <form id="resetForm" novalidate>
      <div class="field">
        <label for="password">New password</label>
        <div class="input-wrap">
          <input type="password" id="password" autocomplete="new-password" placeholder="Min. 8 characters">
          <button type="button" class="eye-btn" id="eyeBtn1">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          </button>
        </div>
        <span class="err-msg" id="passErr">Password must be at least 8 characters</span>
      </div>
      <div class="field">
        <label for="confirmPass">Confirm new password</label>
        <div class="input-wrap">
          <input type="password" id="confirmPass" autocomplete="new-password" placeholder="Repeat password">
          <button type="button" class="eye-btn" id="eyeBtn2">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          </button>
        </div>
        <span class="err-msg" id="confirmErr">Passwords do not match</span>
      </div>
      <button type="submit" class="btn" id="submitBtn">Reset Password</button>
    </form>
  </div>
</div>
<footer>Powered by Paylode Services Limited &mdash; MPGS Parallex Bank Onboarding Portal</footer>

<script>
const API = '/api/v1/mpgs-portal';
const token = new URLSearchParams(window.location.search).get('token');

if (!token) {
  document.getElementById('alertErr').textContent = 'Invalid or missing reset token. Please request a new password reset.';
  document.getElementById('alertErr').classList.add('show');
  document.getElementById('resetForm').style.display = 'none';
}

['eyeBtn1','eyeBtn2'].forEach((id, i) => {
  document.getElementById(id).addEventListener('click', () => {
    const inp = document.getElementById(i === 0 ? 'password' : 'confirmPass');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  });
});

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password    = document.getElementById('password').value;
  const confirmPass = document.getElementById('confirmPass').value;

  document.getElementById('passErr').classList.remove('show');
  document.getElementById('confirmErr').classList.remove('show');
  document.getElementById('password').classList.remove('err');
  document.getElementById('confirmPass').classList.remove('err');

  let valid = true;
  if (!password || password.length < 8) { document.getElementById('password').classList.add('err'); document.getElementById('passErr').classList.add('show'); valid = false; }
  if (password !== confirmPass) { document.getElementById('confirmPass').classList.add('err'); document.getElementById('confirmErr').classList.add('show'); valid = false; }
  if (!valid) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Resetting…';
  document.getElementById('alertErr').classList.remove('show');

  try {
    const r = await fetch(`${API}/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password }),
    });
    const d = await r.json();
    if (!d.status) throw new Error(d.message || 'Reset failed');
    const ok = document.getElementById('alertOk');
    ok.textContent = 'Password reset successfully. Redirecting to login…';
    ok.classList.add('show');
    document.getElementById('resetForm').style.display = 'none';
    setTimeout(() => window.location.href = 'mpgs-login.html', 2000);
  } catch (err) {
    const el = document.getElementById('alertErr');
    el.textContent = err.message;
    el.classList.add('show');
    btn.disabled = false; btn.textContent = 'Reset Password';
  }
});
</script>
<script src="/chat-widget.js"></script>
</body>
</html>
