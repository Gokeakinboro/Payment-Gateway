# MPGS / Parallex Bank Merchant Onboarding Portal
# Subdomain: mpgs.paylodeservices.com
#
# STEP 1 (active): HTTP only. Cloudflare proxy handles SSL in front.
# STEP 2 (after DNS propagates): run:
#   certbot --nginx -d mpgs.paylodeservices.com --non-interactive --agree-tos --email gokeakinboro@gmail.com
#   systemctl reload nginx
# Then uncomment the SSL block below and remove the plain HTTP server block.

server {
    listen 80;
    server_name mpgs.paylodeservices.com;
    root /var/www/paylode;
    index mpgs-login.html;
    server_tokens off;

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = / {
        return 301 /mpgs-login.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 15M;
    }

    location /health {
        return 200 'mpgs-ok';
        add_header Content-Type text/plain;
        access_log off;
    }
}

