# MPGS / Parallex Bank Merchant Onboarding Portal
# Subdomain: mpgs.paylodeservices.com
# Serves static HTML from the same root as paylodeservices.com,
# proxies all /api/ calls to the same backend on port 3000.

server {
    server_name mpgs.paylodeservices.com;
    root /var/www/paylode;
    index mpgs-login.html;
    server_tokens off;

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Route root and any bare path to the login page
    location = / {
        return 301 /mpgs-login.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Increase body size for file uploads (10 MB + headroom)
        client_max_body_size 15M;
    }

    location /health {
        return 200 'mpgs-ok';
        add_header Content-Type text/plain;
        access_log off;
    }

    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/paylodeservices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paylodeservices.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = mpgs.paylodeservices.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name mpgs.paylodeservices.com;
    return 404;
}
