<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPGS Portal — Log In</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1a2744;--lime:#7dc534;--white:#fff;--g50:#f8fafc;--g100:#f1f5f9;--g200:#e2e8f0;--g300:#cbd5e1;--g400:#94a3b8;--g500:#64748b;--g600:#475569;--g700:#334155;--g800:#1e293b;--red:#ef4444;--font:'DM Sans',sans-serif}
body{font-family:var(--font);background:var(--g50);color:var(--g800);min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--navy);height:56px;display:flex;align-items:center;padding:0 32px;gap:12px}
.logo-box{width:32px;height:32px;background:var(--lime);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--navy);font-size:14px}
.logo-name{color:#fff;font-weight:700;font-size:15px}
.logo-sep{color:rgba(255,255,255,.3);margin:0 4px}
.logo-sub{color:rgba(255,255,255,.6);font-size:13px}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card{background:#fff;border:1.5px solid var(--g200);border-radius:14px;padding:40px;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(26,39,68,.07)}
.card-title{font-size:22px;font-weight:700;color:var(--navy);margin-bottom:6px}
.card-sub{font-size:14px;color:var(--g500);margin-bottom:28px}
.field{margin-bottom:18px}
label{display:block;font-size:12px;font-weight:600;color:var(--g600);margin-bottom:5px;letter-spacing:.3px;text-transform:uppercase}
.input-wrap{position:relative}
input{width:100%;padding:11px 14px;border:1.5px solid var(--g300);border-radius:8px;font-size:14px;font-family:var(--font);color:var(--g800);background:#fff;outline:none;transition:border-color .15s}
input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(26,39,68,.07)}
input.err{border-color:var(--red)}
.eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--g400);padding:4px;display:flex;align-items:center}
.eye-btn:hover{color:var(--g600)}
.err-msg{font-size:12px;color:var(--red);margin-top:4px;display:none}
.err-msg.show{display:block}
.forgot{display:block;text-align:right;font-size:12px;color:var(--navy);text-decoration:none;margin-top:6px;font-weight:500}
.forgot:hover{text-decoration:underline}
.btn{width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;margin-top:8px;transition:background .15s}
.btn:hover{background:#253360}
.btn:disabled{opacity:.6;cursor:not-allowed}
.divider{height:1px;background:var(--g200);margin:24px 0}
.register-link{text-align:center;font-size:13px;color:var(--g500)}
.register-link a{color:var(--navy);font-weight:600;text-decoration:none}
.register-link a:hover{text-decoration:underline}
.alert{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:18px;display:none}
.alert.show{display:block}
.alert.err{background:#fef2f2;border:1px solid #fecaca;color:#dc2626}
.alert.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#16a34a}
footer{text-align:center;padding:20px;font-size:12px;color:var(--g400)}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo-box">P</div>
  <span class="logo-name">Paylode</span>
  <span class="logo-sep">|</span>
  <span class="logo-sub">MPGS Onboarding Portal</span>
</div>
<div class="wrap">
  <div class="card">
    <h1 class="card-title">Welcome back</h1>
    <p class="card-sub">Log in to continue your MPGS onboarding application.</p>

    <div class="alert err" id="alertErr"></div>
    <div class="alert ok" id="alertOk"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" autocomplete="email" placeholder="you@company.com">
        <span class="err-msg" id="emailErr">Please enter a valid email address</span>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
          <button type="button" class="eye-btn" id="eyeBtn" aria-label="Toggle password visibility">
            <svg id="eyeIcon" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
        <span class="err-msg" id="passErr">Password is required</span>
        <a href="mpgs-forgot.html" class="forgot">Forgot password?</a>
      </div>
      <button type="submit" class="btn" id="submitBtn">Log In</button>
    </form>

    <div class="divider"></div>
    <p class="register-link">Don't have an account? <a href="mpgs-register.html">Create one</a></p>
  </div>
</div>
<footer>Powered by Paylode Services Limited &mdash; MPGS Parallex Bank Onboarding Portal</footer>

<script>
const API = '/api/v1/mpgs-portal';

// Already logged in?
(function(){
  const t = localStorage.getItem('mpgs_token');
  if (t) window.location.href = 'mpgs-dashboard.html';
})();

const eyeBtn = document.getElementById('eyeBtn');
const passInput = document.getElementById('password');
eyeBtn.addEventListener('click', () => {
  const show = passInput.type === 'password';
  passInput.type = show ? 'text' : 'password';
  document.getElementById('eyeIcon').innerHTML = show
    ? '<path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>'
    : '<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  let valid = true;

  document.getElementById('emailErr').classList.remove('show');
  document.getElementById('passErr').classList.remove('show');
  document.getElementById('email').classList.remove('err');
  document.getElementById('password').classList.remove('err');

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    document.getElementById('emailErr').classList.add('show');
    document.getElementById('email').classList.add('err');
    valid = false;
  }
  if (!password) {
    document.getElementById('passErr').classList.add('show');
    document.getElementById('password').classList.add('err');
    valid = false;
  }
  if (!valid) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Logging in…';
  document.getElementById('alertErr').classList.remove('show');

  try {
    const r = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const d = await r.json();
    if (!d.status) throw new Error(d.message || 'Login failed');
    localStorage.setItem('mpgs_token', d.data.token);
    localStorage.setItem('mpgs_user', JSON.stringify(d.data.applicant));
    window.location.href = 'mpgs-dashboard.html';
  } catch (err) {
    const el = document.getElementById('alertErr');
    el.textContent = err.message;
    el.classList.add('show');
    btn.disabled = false; btn.textContent = 'Log In';
  }
});
</script>
<script src="/chat-widget.js"></script>
</body>
</html>
