<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff CRM — Super Admin</title>
<link rel="stylesheet" href="paylode-ui.css?v=3">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1a2744;--lime:#7dc534;--bg:#f4f6fb;--gray:#64748b;--line:#cbd5e1;--green:#16a34a;--red:#dc2626}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#1e293b;font-size:14px}
.shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:var(--navy);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;transition:left .25s}
.sb-logo{padding:20px 18px 14px;color:#fff;font-weight:800;font-size:17px;letter-spacing:-.3px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo span{color:var(--lime)}
.sb-section{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.6px;padding:16px 18px 6px}
.sb-link{display:flex;align-items:center;gap:9px;padding:9px 18px;color:rgba(255,255,255,.7);text-decoration:none;font-size:13px;font-weight:500;border-left:3px solid transparent;transition:all .15s}
.sb-link:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-link.active{background:rgba(125,197,52,.12);color:var(--lime);font-weight:600;border-left-color:var(--lime)}
.sb-link i{width:15px;height:15px;flex-shrink:0}
.main-pane{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:0 22px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.hamburger{display:none;background:none;border:none;cursor:pointer;padding:4px;color:var(--navy)}
.topbar-title{font-weight:700;font-size:15px;color:var(--navy)}
.page-body{flex:1;overflow-y:auto;padding:22px}
@media(max-width:768px){.sidebar{position:fixed;top:0;left:-220px;height:100vh;z-index:100}.sidebar.open{left:0}.hamburger{display:flex}.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}.sb-overlay.show{display:block}}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);margin-bottom:12px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.col{flex:1;min-width:160px}
.stat-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;text-align:center}
.stat-val{font-size:26px;font-weight:800;color:var(--navy)}
.stat-lbl{font-size:11px;color:var(--gray);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--gray);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#f8fafc}
.right{text-align:right}
.btn{padding:7px 14px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.btn-lime{background:var(--lime);color:var(--navy)}
.btn-out{background:#fff;color:var(--gray);border:1px solid var(--line)}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-red{background:#fee2e2;color:var(--red);border:none}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;display:inline-block}
.pill.prospect{background:#f1f5f9;color:#475569}
.pill.engaged{background:#dbeafe;color:#1e40af}
.pill.onboarded{background:#fef3c7;color:#92400e}
.pill.active{background:#d1fae5;color:#065f46}
.pill.churned{background:#fee2e2;color:#991b1b}
.pill.staff{background:#f3e8ff;color:#7c3aed}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:20px}
.tab-btn{background:none;border:none;padding:10px 18px;font-size:13px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--lime)}
.tab-pane{display:none}.tab-pane.active{display:block}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:24px;width:460px;max-width:96vw}
.modal h3{font-size:15px;font-weight:700;margin-bottom:16px}
label{display:block;font-size:11px;font-weight:700;color:var(--gray);margin-bottom:4px;text-transform:uppercase}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit}
.form-row{display:flex;gap:10px;margin-bottom:10px}
.form-group{flex:1}
.msg{padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none}
.msg.ok{background:#f0fdf4;color:#166534;display:block}
.msg.err{background:#fee2e2;color:#991b1b;display:block}
.muted{color:var(--gray);padding:24px;text-align:center}
.search-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.search-bar input,.search-bar select{flex:1;min-width:140px}
.rank-medal{font-size:18px;width:28px;text-align:center}
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200}
.drawer-overlay.show{display:block}
.drawer{position:fixed;top:0;right:-600px;width:600px;max-width:100vw;height:100vh;background:#fff;z-index:201;transition:right .25s;display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.12)}
.drawer.open{right:0}
.drawer-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.eng-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:6px;font-weight:600}
.eng-badge.call{background:#f0fdf4;color:#166534}
.eng-badge.visit{background:#eff6ff;color:#1d4ed8}
.eng-badge.email{background:#fef3c7;color:#92400e}
.eng-badge.whatsapp{background:#d1fae5;color:#065f46}
.eng-badge.demo{background:#f3e8ff;color:#7c3aed}
.eng-badge.other{background:#f1f5f9;color:#475569}
</style>
</head>
<body>
<div class="sb-overlay" id="sbOverlay" onclick="closeSidebar()"></div>
<div class="shell">
  <nav class="sidebar" id="sidebar">
    <div class="sb-logo">Pay<span>lode</span> <small style="font-size:10px;opacity:.5">CRM SA</small></div>
    <div class="sb-section">CRM</div>
    <a href="#" class="sb-link active" onclick="showTab('clients',this)"><i data-lucide="users"></i> All Clients</a>
    <a href="#" class="sb-link" onclick="showTab('leaderboard',this)"><i data-lucide="trophy"></i> Leaderboard</a>
    <a href="#" class="sb-link" onclick="showTab('staff',this)"><i data-lucide="user-check"></i> Staff</a>
    <div class="sb-section">Links</div>
    <a href="dashboard.html" class="sb-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
    <a href="staff.html" class="sb-link"><i data-lucide="briefcase"></i> My CRM view</a>
  </nav>

  <div class="main-pane">
    <div class="topbar">
      <div class="topbar-left">
        <button class="hamburger" onclick="toggleSidebar()"><i data-lucide="menu" style="width:20px;height:20px"></i></button>
        <span class="topbar-title" id="topbarTitle">All Clients</span>
      </div>
    </div>

    <div class="page-body">
      <div class="msg" id="globalMsg"></div>

      <!-- ── ALL CLIENTS ─────────────────────────────────── -->
      <div class="tab-pane active" id="tab-clients">
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
            <div class="card-title" style="margin:0">All Clients</div>
          </div>
          <div class="search-bar">
            <input type="text" id="clientSearch" placeholder="Search name, email…" oninput="debSearch()">
            <select id="officerFilter" onchange="loadClients()"><option value="">All officers</option></select>
            <select id="stageFilter" onchange="loadClients()">
              <option value="">All stages</option>
              <option value="prospect">Prospect</option>
              <option value="engaged">Engaged</option>
              <option value="onboarded">Onboarded</option>
              <option value="active">Active</option>
              <option value="churned">Churned</option>
            </select>
          </div>
          <div id="clientList"><div class="muted">Loading…</div></div>
        </div>
      </div>

      <!-- ── LEADERBOARD ─────────────────────────────────── -->
      <div class="tab-pane" id="tab-leaderboard">
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <div class="card-title" style="margin:0">Monthly Leaderboard</div>
            <input type="month" id="lbMonth" onchange="loadLeaderboard()" style="width:160px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px">
          </div>
          <div id="leaderboardTable"><div class="muted">Loading…</div></div>
        </div>
      </div>

      <!-- ── STAFF ───────────────────────────────────────── -->
      <div class="tab-pane" id="tab-staff">
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <div class="card-title" style="margin:0">Staff members</div>
            <button class="btn btn-lime" onclick="openCreateStaff()"><i data-lucide="user-plus" style="width:14px;height:14px"></i> Add staff</button>
          </div>
          <div id="staffList"><div class="muted">Loading…</div></div>
        </div>
        <div class="card" id="bulkReassignCard">
          <div class="card-title">Bulk reassign — staff departure</div>
          <div class="form-row">
            <div class="form-group">
              <label>From (departing staff)</label>
              <select id="bulkFrom"><option value="">Select…</option></select>
            </div>
            <div class="form-group">
              <label>To (new officer)</label>
              <select id="bulkTo"><option value="">Select…</option></select>
            </div>
          </div>
          <div style="margin-bottom:10px">
            <label>Reason</label>
            <input type="text" id="bulkReason" placeholder="e.g. staff resigned">
          </div>
          <button class="btn" onclick="bulkReassign()">Reassign all clients</button>
          <div class="msg" id="bulkMsg"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── CREATE STAFF MODAL ─────────────────────────────────────────── -->
<div class="modal-overlay" id="createStaffModal">
  <div class="modal">
    <h3>Add staff member</h3>
    <div class="msg" id="createStaffMsg"></div>
    <div class="form-row">
      <div class="form-group"><label>First name</label><input type="text" id="sf-fname"></div>
      <div class="form-group"><label>Last name</label><input type="text" id="sf-lname"></div>
    </div>
    <div style="margin-bottom:10px"><label>Email</label><input type="email" id="sf-email"></div>
    <div style="margin-bottom:16px"><label>Temp password</label><input type="password" id="sf-pw" placeholder="They'll be prompted to change it"></div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-lime" onclick="createStaff()">Create</button>
      <button class="btn btn-out" onclick="closeCreateStaff()">Cancel</button>
    </div>
  </div>
</div>

<!-- ── TRANSFER MODAL ─────────────────────────────────────────────── -->
<div class="modal-overlay" id="transferModal">
  <div class="modal">
    <h3>Transfer client</h3>
    <div class="msg" id="transferMsg"></div>
    <p style="font-size:13px;margin-bottom:12px;color:var(--gray)" id="transferMerchName"></p>
    <div style="margin-bottom:10px">
      <label>New account officer</label>
      <select id="transferTo"><option value="">Select…</option></select>
    </div>
    <div style="margin-bottom:16px">
      <label>Reason</label>
      <input type="text" id="transferReason" placeholder="Optional">
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-lime" onclick="doTransfer()">Transfer</button>
      <button class="btn btn-out" onclick="closeTransfer()">Cancel</button>
    </div>
  </div>
</div>

<!-- ── CLIENT DRAWER ──────────────────────────────────────────────── -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="clientDrawer">
  <div class="drawer-head">
    <div>
      <div style="font-weight:700;font-size:15px" id="drawerTitle">Client</div>
      <div style="font-size:12px;color:var(--gray)" id="drawerSub"></div>
    </div>
    <button class="btn btn-out btn-sm" onclick="closeDrawer()">Close</button>
  </div>
  <div class="drawer-body">
    <div class="tabs">
      <button class="tab-btn active" onclick="dTab('engagements',this)">Engagements</button>
      <button class="tab-btn" onclick="dTab('transactions',this)">Transactions</button>
      <button class="tab-btn" onclick="dTab('history',this)">Reassignment history</button>
    </div>
    <div id="dtab-engagements">
      <div class="card" style="margin-bottom:12px">
        <div class="card-title">Log engagement</div>
        <div class="form-row">
          <div class="form-group"><label>Type</label>
            <select id="eng-type">
              <option value="call">Call</option><option value="visit">Visit</option>
              <option value="email">Email</option><option value="whatsapp">WhatsApp</option>
              <option value="demo">Demo</option><option value="other">Other</option>
            </select>
          </div>
          <div class="form-group"><label>Date</label><input type="datetime-local" id="eng-date"></div>
        </div>
        <div style="margin-bottom:10px"><label>Notes</label><textarea id="eng-notes" placeholder="What was discussed…"></textarea></div>
        <button class="btn btn-lime" onclick="logEngagement()">Log</button>
      </div>
      <div id="engList"><div class="muted">Loading…</div></div>
    </div>
    <div id="dtab-transactions" style="display:none">
      <div id="txnList"><div class="muted">Loading…</div></div>
    </div>
    <div id="dtab-history" style="display:none">
      <div id="histList"><div class="muted">Loading…</div></div>
    </div>
  </div>
</div>

<script>
var API='/api/v1';
var TOKEN=sessionStorage.getItem('paylode_token');
if(!TOKEN)location.href='/login.html';

var staffList=[];
var currentMerchantId=null;
var transferMerchantId=null;
var searchTimer=null;

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);}
function ngn(k){return '₦'+(Number(k||0)/100).toLocaleString('en-NG',{minimumFractionDigits:2});}
function fmtDate(d){return d?new Date(d).toLocaleDateString('en-NG',{day:'2-digit',month:'short',year:'numeric'}):'—';}
function fmtDT(d){return d?new Date(d).toLocaleString('en-NG',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';}

async function apiFetch(path,opts){
  opts=opts||{};
  var r=await fetch(API+path,{method:opts.method||'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:opts.body?JSON.stringify(opts.body):undefined});
  if(r.status===401){location.href='/login.html';return{ok:false};}
  var d=await r.json().catch(()=>({}));
  return{ok:r.ok&&d.status!==false,data:d.data,message:d.message};
}
function gMsg(ok,t){var m=document.getElementById('globalMsg');m.className='msg '+(ok?'ok':'err');m.textContent=t;}

var tabTitles={clients:'All Clients',leaderboard:'Monthly Leaderboard',staff:'Staff'};
function showTab(name,el){
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.sb-link').forEach(a=>a.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(el)el.classList.add('active');
  document.getElementById('topbarTitle').textContent=tabTitles[name]||name;
  if(name==='leaderboard')loadLeaderboard();
  if(name==='staff'){loadStaff();populateBulkDrops();}
}

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sbOverlay').classList.toggle('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sbOverlay').classList.remove('show');}

// ── Init ─────────────────────────────────────────────────────────────────
(async()=>{
  document.getElementById('lbMonth').value=new Date().toISOString().slice(0,7);
  await Promise.all([loadStaffForDropdowns(), loadClients()]);
})();

async function loadStaffForDropdowns(){
  var r=await apiFetch('/staff/admin/staff-list');
  if(!r.ok)return;
  staffList=r.data||[];
  var officerSel=document.getElementById('officerFilter');
  staffList.forEach(s=>{
    var o=new Option(s.first_name+' '+s.last_name,s.id);
    officerSel.appendChild(o);
  });
}

// ── Clients ───────────────────────────────────────────────────────────────
function debSearch(){clearTimeout(searchTimer);searchTimer=setTimeout(loadClients,350);}
async function loadClients(){
  var s=document.getElementById('clientSearch').value.trim();
  var off=document.getElementById('officerFilter').value;
  var st=document.getElementById('stageFilter').value;
  var q='?';
  if(s)q+='search='+encodeURIComponent(s)+'&';
  if(off)q+='officer_id='+encodeURIComponent(off)+'&';
  if(st)q+='stage='+encodeURIComponent(st)+'&';
  var r=await apiFetch('/staff/admin/clients'+q);
  var el=document.getElementById('clientList');
  if(!r.ok){el.innerHTML='<div class="muted">Could not load.</div>';return;}
  if(!r.data.length){el.innerHTML='<div class="muted">No clients found.</div>';return;}
  el.innerHTML='<table><thead><tr><th>Merchant</th><th>Officer</th><th>Stage</th><th class="right">Volume</th><th>Last Engaged</th><th></th></tr></thead><tbody>'+
    r.data.map(m=>`<tr>
      <td><strong>${esc(m.business_name)}</strong><br><small style="color:var(--gray)">${esc(m.business_email)}</small></td>
      <td>${m.officer_name?esc(m.officer_name):'<em style="color:var(--gray)">Unassigned</em>'}</td>
      <td><span class="pill ${esc(m.pipeline_stage||'prospect')}">${esc(m.pipeline_stage||'prospect')}</span></td>
      <td class="right">${ngn(m.total_vol_kobo)}</td>
      <td>${fmtDate(m.last_engaged_at)}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-sm btn-out" onclick='openDrawer("${esc(m.id)}","${esc(m.business_name).replace(/"/g,'')}")' style="margin-right:4px">View</button>
        <button class="btn btn-sm btn-lime" onclick='openTransfer("${esc(m.id)}","${esc(m.business_name).replace(/"/g,'')}")'>Transfer</button>
      </td>
    </tr>`).join('')+'</tbody></table>';
}

// ── Leaderboard ───────────────────────────────────────────────────────────
async function loadLeaderboard(){
  var month=document.getElementById('lbMonth').value;
  var r=await apiFetch('/staff/admin/performance?month='+encodeURIComponent(month));
  var el=document.getElementById('leaderboardTable');
  if(!r.ok){el.innerHTML='<div class="muted">Failed to load.</div>';return;}
  if(!r.data.length){el.innerHTML='<div class="muted">No data.</div>';return;}
  var medals=['🥇','🥈','🥉'];
  el.innerHTML='<table><thead><tr><th>#</th><th>Officer</th><th class="right">Volume</th><th class="right">Txns</th><th>Clients</th><th>Active</th><th>Engagements</th><th>Onboarded</th></tr></thead><tbody>'+
    r.data.map((s,i)=>`<tr>
      <td class="rank-medal">${medals[i]||i+1}</td>
      <td><strong>${esc(s.officer_name)}</strong></td>
      <td class="right">${ngn(s.vol_kobo)}</td>
      <td class="right">${s.txn_count}</td>
      <td>${s.total_clients}</td>
      <td>${s.active_clients}</td>
      <td>${s.engagements}</td>
      <td>${s.new_onboarded}</td>
    </tr>`).join('')+'</tbody></table>';
}

// ── Staff list ────────────────────────────────────────────────────────────
async function loadStaff(){
  var r=await apiFetch('/staff/admin/staff-list');
  var el=document.getElementById('staffList');
  if(!r.ok){el.innerHTML='<div class="muted">Failed to load.</div>';return;}
  if(!r.data.length){el.innerHTML='<div class="muted">No staff yet. Create one above.</div>';return;}
  el.innerHTML='<table><thead><tr><th>Name</th><th>Email</th><th>Clients</th><th>Status</th><th></th></tr></thead><tbody>'+
    r.data.map(s=>`<tr>
      <td><strong>${esc(s.first_name)} ${esc(s.last_name)}</strong></td>
      <td>${esc(s.email)}</td>
      <td>${s.client_count}</td>
      <td><span class="pill ${s.is_active?'active':'churned'}">${s.is_active?'Active':'Inactive'}</span></td>
      <td><button class="btn btn-sm ${s.is_active?'btn-red btn-out':'btn-lime'}" onclick="toggleStaff('${esc(s.id)}',${s.is_active})">${s.is_active?'Deactivate':'Reactivate'}</button></td>
    </tr>`).join('')+'</tbody></table>';
}

function populateBulkDrops(){
  ['bulkFrom','bulkTo'].forEach(id=>{
    var sel=document.getElementById(id);
    sel.innerHTML='<option value="">Select…</option>';
    staffList.forEach(s=>{sel.appendChild(new Option(s.first_name+' '+s.last_name,s.id));});
  });
}

function openCreateStaff(){document.getElementById('createStaffModal').classList.add('show');}
function closeCreateStaff(){document.getElementById('createStaffModal').classList.remove('show');}

async function createStaff(){
  var body={first_name:document.getElementById('sf-fname').value.trim(),last_name:document.getElementById('sf-lname').value.trim(),email:document.getElementById('sf-email').value.trim(),password:document.getElementById('sf-pw').value};
  var r=await apiFetch('/staff/admin/staff',{method:'POST',body});
  var m=document.getElementById('createStaffMsg');
  m.className='msg '+(r.ok?'ok':'err');m.textContent=r.ok?'Staff created successfully':(r.message||'Failed');
  if(r.ok){closeCreateStaff();staffList=[];loadStaff();populateBulkDrops();loadStaffForDropdowns();}
}

async function toggleStaff(id,isActive){
  if(!confirm(isActive?'Deactivate this staff member?':'Reactivate?'))return;
  var r=await apiFetch('/staff/admin/staff/'+id,{method:'PATCH',body:{is_active:!isActive}});
  gMsg(r.ok,r.ok?'Staff updated':(r.message||'Failed'));
  if(r.ok)loadStaff();
}

async function bulkReassign(){
  var from=document.getElementById('bulkFrom').value;
  var to=document.getElementById('bulkTo').value;
  var reason=document.getElementById('bulkReason').value.trim();
  if(!from||!to)return;
  if(!confirm('This will move ALL clients from the selected officer to the new one. Continue?'))return;
  var r=await apiFetch('/staff/admin/bulk-reassign',{method:'POST',body:{from_staff_id:from,to_staff_id:to,reason:reason||undefined}});
  var m=document.getElementById('bulkMsg');
  m.className='msg '+(r.ok?'ok':'err');m.textContent=r.ok?(r.data?.count||r.message||'Done'):(r.message||'Failed');
  if(r.ok)loadClients();
}

// ── Transfer modal ────────────────────────────────────────────────────────
function openTransfer(id,name){
  transferMerchantId=id;
  document.getElementById('transferMerchName').textContent='Transferring: '+name;
  var sel=document.getElementById('transferTo');
  sel.innerHTML='<option value="">Select…</option>';
  staffList.forEach(s=>{sel.appendChild(new Option(s.first_name+' '+s.last_name,s.id));});
  document.getElementById('transferMsg').className='msg';
  document.getElementById('transferModal').classList.add('show');
}
function closeTransfer(){document.getElementById('transferModal').classList.remove('show');transferMerchantId=null;}
async function doTransfer(){
  var to=document.getElementById('transferTo').value;
  var reason=document.getElementById('transferReason').value.trim();
  if(!to)return;
  var r=await apiFetch('/staff/admin/clients/'+transferMerchantId+'/transfer',{method:'POST',body:{to_staff_id:to,reason:reason||undefined}});
  var m=document.getElementById('transferMsg');
  m.className='msg '+(r.ok?'ok':'err');m.textContent=r.ok?'Client transferred':(r.message||'Failed');
  if(r.ok){closeTransfer();loadClients();}
}

// ── Client drawer ─────────────────────────────────────────────────────────
function openDrawer(id,name){
  currentMerchantId=id;
  document.getElementById('clientDrawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('show');
  document.getElementById('drawerTitle').textContent=name;
  document.getElementById('drawerSub').textContent='';
  dTab('engagements',document.querySelector('#clientDrawer .tab-btn'));
  setEngDateTime();
}
function closeDrawer(){document.getElementById('clientDrawer').classList.remove('open');document.getElementById('drawerOverlay').classList.remove('show');currentMerchantId=null;}

function dTab(name,el){
  document.querySelectorAll('#clientDrawer .tab-btn').forEach(b=>b.classList.remove('active'));
  if(el)el.classList.add('active');
  ['engagements','transactions','history'].forEach(t=>{document.getElementById('dtab-'+t).style.display=t===name?'block':'none';});
  if(name==='engagements')loadEngagements();
  if(name==='transactions')loadTxns();
  if(name==='history')loadHistory();
}

function setEngDateTime(){
  var now=new Date();now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
  document.getElementById('eng-date').value=now.toISOString().slice(0,16);
}

async function loadEngagements(){
  if(!currentMerchantId)return;
  var r=await apiFetch('/staff/clients/'+currentMerchantId+'/engagements');
  var el=document.getElementById('engList');
  if(!r.ok||!r.data.length){el.innerHTML='<div class="muted">No engagements yet.</div>';return;}
  el.innerHTML=r.data.map(e=>`
    <div style="border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span class="eng-badge ${esc(e.type)}">${esc(e.type)}</span>
        <span style="font-size:11px;color:var(--gray)">${fmtDT(e.engaged_at)}</span>
        <span style="font-size:11px;color:var(--gray);margin-left:auto">by ${esc(e.logged_by)}</span>
      </div>
      ${e.notes?`<div style="font-size:13px">${esc(e.notes)}</div>`:'<div style="color:var(--gray);font-size:12px">No notes</div>'}
    </div>`).join('');
}

async function logEngagement(){
  if(!currentMerchantId)return;
  var body={type:document.getElementById('eng-type').value,notes:document.getElementById('eng-notes').value.trim()||null,engaged_at:document.getElementById('eng-date').value||null};
  var r=await apiFetch('/staff/clients/'+currentMerchantId+'/engagements',{method:'POST',body});
  gMsg(r.ok,r.ok?'Engagement logged':(r.message||'Failed'));
  if(r.ok){document.getElementById('eng-notes').value='';setEngDateTime();loadEngagements();}
}

async function loadTxns(){
  if(!currentMerchantId)return;
  var r=await apiFetch('/staff/clients/'+currentMerchantId+'/transactions');
  var el=document.getElementById('txnList');
  if(!r.ok||!r.data.length){el.innerHTML='<div class="muted">No transactions.</div>';return;}
  el.innerHTML='<table><thead><tr><th>Ref</th><th>Channel</th><th class="right">Amount</th><th>Status</th><th>Date</th></tr></thead><tbody>'+
    r.data.map(t=>`<tr>
      <td><small>${esc(t.txn_ref)}</small></td>
      <td>${esc(t.channel||'—')}</td>
      <td class="right">₦${(Number(t.amount_kobo||0)/100).toLocaleString('en-NG',{minimumFractionDigits:2})}</td>
      <td>${esc(t.status)}</td>
      <td>${fmtDate(t.created_at)}</td>
    </tr>`).join('')+'</tbody></table>';
}

async function loadHistory(){
  if(!currentMerchantId)return;
  var r=await apiFetch('/staff/admin/reassignment-history/'+currentMerchantId);
  var el=document.getElementById('histList');
  if(!r.ok||!r.data.length){el.innerHTML='<div class="muted">No reassignment history.</div>';return;}
  el.innerHTML='<table><thead><tr><th>Date</th><th>From</th><th>To</th><th>By</th><th>Reason</th></tr></thead><tbody>'+
    r.data.map(h=>`<tr>
      <td>${fmtDate(h.reassigned_at)}</td>
      <td>${h.from_name?esc(h.from_name):'—'}</td>
      <td>${h.to_name?esc(h.to_name):'—'}</td>
      <td>${esc(h.by_name||'—')}</td>
      <td>${esc(h.reason||'—')}</td>
    </tr>`).join('')+'</tbody></table>';
}

lucide.createIcons();
</script>
</body>
</html>
